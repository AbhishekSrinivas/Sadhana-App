name: Build Sadhana APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sadhana-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/haptics

      - name: Split into app and launcher for self-updates
        env:
          BUILD_ID: ${{ github.run_number }}
        run: python3 ota.py

      - name: Add the native speech and vibration bridge
        run: |
          cp native-shim.js www/native-shim.js
          grep -q native-shim www/app.html || sed -i "s#</body>#<script src='native-shim.js'></script></body>#" www/app.html

      - name: App icon (Panchanga wheel)
        run: npx --yes @capacitor/assets generate --android

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sadhana-APK
          path: sadhana-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Sadhana.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Sadhana.apk www/app.html www/version.json \
            --title "Sadhana (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download Sadhana.apk, open it on an Android device and allow installs from this source. app.html and version.json are what installed apps download when they check for updates."
